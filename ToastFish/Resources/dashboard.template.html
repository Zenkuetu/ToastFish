/* ============================================================
   CSS Variables & Reset
   ============================================================ */
:root {
  --bg-deep: #06060F;
  --bg-primary: #0A0A1A;
  --bg-card: #0F0F25;
  --bg-card-hover: #141430;
  --border: #1A1A3E;
  --border-glow: #2A2A5E;
  --neon-cyan: #00F0FF;
  --neon-cyan-dim: rgba(0, 240, 255, 0.3);
  --neon-magenta: #FF00FF;
  --neon-magenta-dim: rgba(255, 0, 255, 0.3);
  --neon-amber: #FFC83C;
  --neon-amber-dim: rgba(255, 200, 60, 0.3);
  --neon-green: #00FF88;
  --neon-red: #FF3355;
  --text-primary: #E0E0F0;
  --text-secondary: #9090B0;
  --text-dim: #6060A0;
  --font-display: 'Orbitron', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  --font-body: 'Rajdhani', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;
  --font-jp: 'Yu Gothic UI', 'Meiryo', 'Microsoft YaHei', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  font-size: 14px;
}

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: overlay;
}

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--neon-cyan-dim);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }

/* Scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.03) 2px,
    rgba(0, 0, 0, 0.03) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* ============================================================
   Starfield Canvas
   ============================================================ */
#starfield {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ============================================================
   Nav Header
   ============================================================ */
.nav-header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 32px;
  background: rgba(10, 10, 26, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  gap: 24px;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.nav-brand .logo-icon {
  font-size: 24px;
  filter: drop-shadow(0 0 8px var(--neon-amber));
}

.nav-brand h1 {
  font-family: var(--font-display);

/* ============================================================
   Page Layout
   ============================================================ */
.page {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 32px 40px;
}

/* No transition needed — v-show keeps components alive */

/* Page visibility transition */
.page {
  transition: opacity 0.25s ease;
}

.page[style*="display: none"] {
  opacity: 0;
}

/* ============================================================
   KPI Row
   ============================================================ */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}

.kpi-card {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 16px;
  text-align: center;
  transition: all 0.3s ease;
  overflow: hidden;
}

.kpi-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 10px;
  padding: 1px;
  background: linear-gradient(135deg, transparent 40%, var(--neon-cyan-dim));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0;
  transition: opacity 0.3s;
}

.kpi-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0, 240, 255, 0.08);
}

.kpi-card:hover::before { opacity: 1; }

.kpi-card .kpi-icon {
  font-size: 28px;
  margin-bottom: 8px;
  display: block;
}

.kpi-card .kpi-value {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 900;
  color: var(--neon-cyan);
  text-shadow: 0 0 20px var(--neon-cyan-dim);
  line-height: 1.2;
}

.kpi-card .kpi-value.pct { color: var(--neon-magenta); text-shadow: 0 0 20px var(--neon-magenta-dim); }

.kpi-card .kpi-label {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 4px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.kpi-card .jp-decor {
  position: absolute;
  bottom: 6px;
  right: 10px;
  font-family: var(--font-jp);
  font-size: 10px;
  color: rgba(96, 96, 160, 0.2);
  pointer-events: none;
}

/* ============================================================
   Chart Card
   ============================================================ */
.chart-grid-2x2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}

.row-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}

.chart-card {
  background: var(--bg-card);

.chart-card:hover {

}

.chart-card.full-width {
  grid-column: 1 / -1;
}

.chart-card h3 {

  font-size: 13px;
  font-weight: 700;

  align-items: center;

.chart-card h3::before {

  box-shadow: 0 0 8px var(--neon-cyan);

// ============================================================
// ToastFish Dashboard — Vue 3 Application
// ============================================================
const { createApp, ref, reactive, computed, watch, onMounted, onBeforeUnmount, nextTick } = Vue

// ─── Read embedded data ───
const appData = JSON.parse(document.getElementById('app-data').textContent)

// ============================================================
// Chart.js global config
// ============================================================
Chart.defaults.color = '#9090B0'
Chart.defaults.borderColor = '#1A1A3E'
Chart.defaults.font.family = "'Rajdhani', sans-serif"
Chart.defaults.font.size = 11
Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(15, 15, 37, 0.96)'
Chart.defaults.plugins.tooltip.borderColor = '#00F0FF'
Chart.defaults.plugins.tooltip.borderWidth = 1
Chart.defaults.plugins.tooltip.titleFont = { family: "'Orbitron'", size: 11 }
Chart.defaults.plugins.tooltip.bodyFont = { family: "'JetBrains Mono'", size: 11 }
Chart.defaults.scale.grid.color = 'rgba(26, 26, 62, 0.5)'
Chart.defaults.scale.grid.drawBorder = false

// ============================================================
// Shared utilities
// ============================================================
function createGradient(ctx, c1, c2) {
  const g = ctx.createLinearGradient(0, 0, 0, 280)
  g.addColorStop(0, c1); g.addColorStop(1, c2); return g
}

function getHeatColor(rate) {
  if (rate === null || rate === undefined) return 'rgba(255,255,255,0.02)'
  if (rate >= 95) return 'rgba(0, 255, 136, 0.7)'
  if (rate >= 85) return 'rgba(0, 240, 255, 0.55)'
  if (rate >= 70) return 'rgba(255, 200, 60, 0.45)'
  if (rate >= 50) return 'rgba(255, 51, 85, 0.4)'
  return 'rgba(255, 51, 85, 0.25)'
}

// ============================================================
// Starfield Background
// ============================================================
const StarfieldBg = {
  setup() {
    const canvas = ref(null)
    let animId = null
    let stars = []

    onMounted(() => {
      const el = document.getElementById('starfield') || document.querySelector('#starfield')
      if (!el) return
      const ctx = el.getContext('2d')
      const resize = () => { el.width = window.innerWidth; el.height = window.innerHeight }
      resize(); window.addEventListener('resize', resize)

      stars = Array.from({length: 100}, () => ({
        x: Math.random() * el.width, y: Math.random() * el.height,
        r: Math.random() * 1.5 + 0.3, vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3, a: Math.random()
      }))

      const draw = () => {
        ctx.clearRect(0, 0, el.width, el.height)
        for (const s of stars) {
          s.x += s.vx; s.y += s.vy
          if (s.x < 0) s.x = el.width; if (s.x > el.width) s.x = 0
          if (s.y < 0) s.y = el.height; if (s.y > el.height) s.y = 0
          const flicker = 0.4 + 0.6 * Math.sin(Date.now() * 0.001 + s.a * 10)
          ctx.beginPath()
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2)
          ctx.fillStyle = `rgba(0, 240, 255, ${flicker * 0.5})`
          ctx.fill()
        }
        animId = requestAnimationFrame(draw)
      }
      draw()
    })

    onBeforeUnmount(() => { animId && cancelAnimationFrame(animId) })

      if (rate >= 85) return 'rgba(0, 240, 255, 0.55)'
      if (rate >= 70) return 'rgba(255, 200, 60, 0.45)'
      if (rate >= 50) return 'rgba(255, 51, 85, 0.4)'
      return 'rgba(255, 51, 85, 0.25)'
    }
  }

const PageEssays = {
  props: ['data'],
  setup(props) {
    const expandedId = ref(-1)
    const toggle = (id) => { expandedId.value = expandedId.value === id ? -1 : id }

    // 展开/收起动画 JS 钩子：基于真实 scrollHeight 做精确高度过渡
    const onEnter = (el, done) => {
      const h = el.scrollHeight
      el.style.height = '0'
      el.style.opacity = '0'
      el.style.transform = 'translateY(-12px)'
      el.style.transition = 'height 0.6s cubic-bezier(0.16,1,0.3,1), opacity 0.45s ease, transform 0.5s cubic-bezier(0.16,1,0.3,1)'
      requestAnimationFrame(() => {
        el.style.height = h + 'px'
        el.style.opacity = '1'
        el.style.transform = 'translateY(0)'
      })
      el.addEventListener('transitionend', function onEnd(e) {
        if (e.propertyName === 'height') {
          el.style.height = 'auto'
          el.style.transition = 'opacity 0.2s ease, transform 0.3s ease'
          el.removeEventListener('transitionend', onEnd)
          done()
        }
      })
    }
    const onLeave = (el, done) => {
      el.style.height = el.scrollHeight + 'px'
      el.style.transition = 'height 0.4s cubic-bezier(0.5,0,0.75,0), opacity 0.3s ease, transform 0.35s cubic-bezier(0.5,0,0.75,0)'
      requestAnimationFrame(() => {
        el.style.height = '0'
        el.style.opacity = '0'
        el.style.transform = 'translateY(-8px)'
      })
      el.addEventListener('transitionend', function onEnd(e) {
        if (e.propertyName === 'height') {
          el.removeEventListener('transitionend', onEnd)
          done()
        }
      })
    }

    const isEssayQ = (q) => Array.isArray(q) && q.length > 0
    const isClozeQ = (q) => q && q.type === 'cloze'
    const isCloze4Q = (q) => q && q.type === 'cloze4'

    // 删除 + 提示
    const deleting = ref(false)
    const toastMsg = ref('')
    const toastType = ref('ok') // 'ok' | 'err'
    const showToast = (msg, type = 'ok') => {
      toastMsg.value = msg; toastType.value = type
      setTimeout(() => { toastMsg.value = '' }, 3000)
    }
    const API_BASE = 'http://localhost:8765'
    const deleteEssay = (id, idx) => {
      if (!confirm(`确定删除短文 #${id}？此操作不可撤销。`)) return
      deleting.value = true
      fetch(API_BASE + '/delete-essay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      })
      .then(r => r.json())
      .then(res => {
        if (res.ok) {
          showToast(`已删除短文 #${id}`)
          const arr = props.data?.essayLogs
          if (arr) arr.splice(idx, 1)
        } else {
          showToast('删除失败: ' + (res.error || '未知错误'), 'err')
        }
      })
      .catch(() => {
        showToast('无法连接 API 服务器（localhost:8765）。请先运行 essay_api.py', 'err')
      })
      .finally(() => { deleting.value = false })
    }

    // 把一篇短文（原文+翻译+题目选项+错误数+正确答案）打包成可询问 AI 的纯文本
    const buildEssayPrompt = (log) => {
      const cloze = isClozeQ(log.questions)
      const attempted = log.attempted || 0
      const correct = log.correct || 0
      const wrong = Math.max(0, attempted - correct)
      const lines = []
      lines.push('【英语阅读练习复盘】')
      lines.push('日期：' + (log.createdAt || ''))
      lines.push('词库：' + (log.bookName || '') + ' · 目标词 ' + (log.wordCount || 0) + ' 个 · ' + (log.modelMode === 1 ? '推理模式' : '快速模式'))
      lines.push('目标词：' + ((log.words || []).join(', ')))
      lines.push('')
      lines.push('—— 短文原文 ——')
      lines.push(log.essayEN || '')
      if (log.essayCN) {
        lines.push('')
        lines.push('—— 中文翻译 ——')
        lines.push(log.essayCN)
      }
      lines.push('')
      lines.push('—— 测验结果 ——')
      lines.push('共作答 ' + attempted + ' 题，答对 ' + correct + ' 题，答错 ' + wrong + ' 题。')
      lines.push('')
      if (cloze) {
        lines.push('—— 15选10 完形填空：候选词 ——')
        const cands = (log.questions && log.questions.candidates) || []
        const sorted = cands.slice().sort((a, b) => {
          const ba = a.blank >= 0 ? a.blank : 999
          const bb = b.blank >= 0 ? b.blank : 999
          return ba - bb
        })
        sorted.forEach(c => {
          if (c.blank >= 0) lines.push('[空' + (c.blank + 1) + '] ' + c.word)
          else lines.push('[干扰词] ' + c.word)
        })
      } else if (isCloze4Q(log.questions)) {
        lines.push('—— 20空四选一 完形填空：各空选项 ——')
        const qs = (log.questions && log.questions.questions) || []
        qs.forEach((q, qi) => {
          lines.push('空' + (q.blank || (qi + 1)) + '：')
          ;(q.options || []).forEach((opt, oi) => {
            const mark = oi === q.answer ? '  (正确答案)' : ''
            lines.push('   ' + String.fromCharCode(65 + oi) + '. ' + opt + mark)
          })
        })
      } else {
        lines.push('—— 题目与选项 ——')
        const qs = Array.isArray(log.questions) ? log.questions : []
        qs.forEach((q, qi) => {
          lines.push('Q' + (qi + 1) + '. ' + (q.q || ''))
          ;(q.choices || []).forEach((c, ci) => {
            const mark = ci === q.answer ? '  (正确答案)' : ''
            lines.push('   ' + String.fromCharCode(65 + ci) + '. ' + c + mark)
          })
          lines.push('')
        })
      }
      lines.push('—— 请 AI 分析 ——')
      lines.push('请帮我复盘这篇英语阅读练习：')
      lines.push('1. 逐题讲解正确答案的定位依据和解题思路；')
      lines.push('2. 归纳文中值得积累的重点词汇、短语和长难句；')
      lines.push('3. 结合作答情况分析我的薄弱环节，给出针对性提升建议。')
      return lines.join('\n')
    }

    const copyEssayForAI = (log) => {
      const text = buildEssayPrompt(log)
      const fallback = () => new Promise((resolve, reject) => {
        const ta = document.createElement('textarea')
        ta.value = text
        ta.style.position = 'fixed'
        ta.style.top = '0'
        ta.style.left = '-9999px'
        document.body.appendChild(ta)
        ta.focus()
        ta.select()
        try {
          const ok = document.execCommand('copy')
          document.body.removeChild(ta)
          ok ? resolve() : reject(new Error('copy failed'))
        } catch (e) {
          document.body.removeChild(ta)
          reject(e)
        }
      })
      const done = () => showToast('已复制复盘文本到剪贴板 ✅')
      const fail = () => showToast('复制失败，请手动选择文本复制', 'err')
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(() => {
          fallback().then(done).catch(fail)
        })
      } else {
        fallback().then(done).catch(fail)
      }
    }

    return { expandedId, toggle, onEnter, onLeave, isEssayQ, isClozeQ, isCloze4Q, deleteEssay, deleting, toastMsg, toastType, copyEssayForAI }
  },
  template: `
<div class="page page-essays">
  <div v-if="!data.essayLogs || data.essayLogs.length === 0" class="placeholder-page">
    <div class="placeholder-icon">🤖</div>
    <div class="placeholder-title">暂无短文记录</div>
    <div class="placeholder-desc">完成一次 AI 短文学习后这里会出现历史记录</div>
  </div>
  <div v-else>
    <h2 style="font-family:var(--font-display);font-size:16px;color:var(--neon-cyan);margin-bottom:20px;letter-spacing:2px;">
      🤖 AI 短文历史 · {{ data.essayLogs.length }} 篇
    </h2>
    <!-- Toast 通知 -->
    <div v-if="toastMsg" class="toast-notify" :class="{ 'toast-err': toastType === 'err' }">{{ toastMsg }}</div>
    <div v-for="(log, idx) in data.essayLogs" :key="log.id" class="essay-card" :class="{expanded: expandedId === log.id}">
      <!-- 摘要行 -->
      <div class="essay-summary" @click="toggle(log.id)">
        <div class="essay-summary-left">
          <span class="essay-type-badge" :class="(isClozeQ(log.questions) || isCloze4Q(log.questions)) ? 'type-cloze' : 'type-reading'">
            {{ isClozeQ(log.questions) ? '🔤 15选10' : (isCloze4Q(log.questions) ? '🔤 20空四选一' : '📖 阅读理解') }}
          </span>
          <span class="essay-date">{{ log.createdAt }}</span>
          <span class="essay-meta">{{ log.bookName }} · {{ log.wordCount }}词 · {{ log.modelMode === 1 ? '推理' : '快速' }} · {{ log.correct || 0 }}/{{ isClozeQ(log.questions) ? (log.attempted || 10) : (isCloze4Q(log.questions) ? (log.attempted || 20) : (log.attempted || 3)) }}正确</span>
        </div>
        <div class="essay-summary-right">
          <span class="essay-snippet">{{ (log.essayEN || '').substring(0, 120) }}{{ (log.essayEN || '').length > 120 ? '...' : '' }}</span>
          <button class="essay-copy-btn" @click.stop="copyEssayForAI(log)" title="打包成文本复制到剪贴板，用于询问 AI">📋 复制</button>
          <button class="essay-delete-btn" @click.stop="deleteEssay(log.id, idx)" :disabled="deleting" title="删除此篇短文">🗑️</button>
          <span class="essay-toggle">{{ expandedId === log.id ? '▲' : '▼' }}</span>
        </div>
      </div>
      <!-- 展开详情（JS 驱动高度动画，基于真实 scrollHeight） -->
      <transition :css="false" @enter="onEnter" @leave="onLeave">
        <div class="essay-detail" v-if="expandedId === log.id">
        <div class="essay-section">
          <h4>📝 目标词</h4>
          <p class="essay-words">{{ (log.words || []).join(', ') }}</p>
        </div>
        <div class="essay-section">
          <h4>📖 短文</h4>
          <p class="essay-text">{{ log.essayEN }}</p>
        </div>
        <div class="essay-section" v-if="log.essayCN">
          <h4>🌐 翻译</h4>
          <p class="essay-text-cn">{{ log.essayCN }}</p>
        </div>
        <!-- 选择题题目 -->
        <div class="essay-section" v-if="isEssayQ(log.questions)">
          <h4>❓ 题目 ({{ log.correct || 0 }}/{{ log.attempted || log.questions.length }} 正确)</h4>
          <div v-for="(q, qi) in log.questions" :key="qi" class="essay-question">
            <p class="eq-text">Q{{ qi + 1 }}. {{ q.q }}</p>
            <div class="eq-choices">
              <span v-for="(c, ci) in q.choices" :key="ci"
                    class="eq-choice"
                    :class="{ correct: ci === q.answer }">
                {{ String.fromCharCode(65 + ci) }}. {{ c }}
              </span>
            </div>
          </div>
        </div>
        <!-- 15选10 候选词 -->
        <div class="essay-section" v-if="isClozeQ(log.questions)">
          <h4>🔤 候选词 (15选10 · {{ log.correct || 0 }}/{{ log.attempted || 10 }} 正确)</h4>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
            <span v-for="(c, ci) in log.questions.candidates" :key="ci"
                  class="cloze-chip"
                  :class="{ 'cloze-correct': c.blank >= 0, 'cloze-distractor': c.blank < 0 }">
              {{ c.word }}<span v-if="c.blank >= 0" class="cloze-blank-tag">[{{ c.blank + 1 }}]</span>
            </span>
          </div>
          <p style="font-size:10px;color:var(--text-dim);">
            <span style="color:var(--neon-green);">● 正确词（填入空位）</span> &nbsp;
            <span style="color:var(--neon-red);">● 干扰词</span>
          </p>
        </div>
        <!-- 20空四选一 完形填空 -->
        <div class="essay-section" v-if="isCloze4Q(log.questions)">
          <h4>🔤 完形填空 (20空四选一 · {{ log.correct || 0 }}/{{ log.attempted || 20 }} 正确)</h4>
          <div v-for="(q, qi) in log.questions.questions" :key="qi" class="essay-question">
            <p class="eq-text">空 {{ q.blank }}：</p>
            <div class="eq-choices">
              <span v-for="(opt, oi) in q.options" :key="oi"
                    class="eq-choice"
                    :class="{ correct: oi === q.answer }">
                {{ String.fromCharCode(65 + oi) }}. {{ opt }}
              </span>
            </div>
          </div>
        </div>
      </div>
      </transition>
    </div>
  </div>
</div>`
}

// ============================================================
// Placeholder Page (future tabs)
// ============================================================
const PagePlaceholder = {
  props: ['data'],
  computed: {
    info() {
      const map = {
        essay: { icon: '🤖', title: 'AI 短文分析', desc: '短文效能评分 · 语境记忆增益 · A/B 对照实验',
                  detail: '每篇 AI 短文生成后追踪文中目标词的后续复习表现，量化语境化学习相对于孤立记忆的增益效果。包含遗忘曲线驱动优先队列、难度自适应引擎、情绪曲线注入等闭环机制。' },
        galaxy: { icon: '🌌', title: '词汇星系', desc: '语义共现网络图 · 知识图谱生长动画',
                  detail: '基于 AI 短文中的词共现频率构建语义网络。每个已学词是一个发光节点，同一篇短文中出现的词之间有连线。每读一篇新短文，星系中亮起新的连接。' },
        insight: { icon: '🧬', title: '深度洞察', desc: 'IRT 项目反应理论 · ML 预测模型 · 个性化建议',
                  detail: '拟合 3PL 模型估算每个词的客观难度、区分度和猜测参数。基于 SM2+ 历史轨迹训练 XGBoost 预测遗忘概率，主动推送高风险词。' }
      }
      return map[this.data?.tab] || map.essay
    }
  },
  template: `
<div class="page placeholder-page">
  <div class="placeholder-icon">{{info.icon}}</div>
  <div class="placeholder-title">{{info.title}}</div>
  <div class="placeholder-desc">機能開発中 · 敬请期待</div>
  <div class="placeholder-preview">
    <h4>{{info.desc}}</h4>
    <p>{{info.detail}}</p>
  </div>
</div>`
}

// ============================================================
// Root Application
// ============================================================
const App = {
  setup() {
    const tabs = [
      { id: 'overview', label: '⚡ 概览', available: true },
      { id: 'academic', label: '🧬 学术', available: true },
      { id: 'essay', label: '🤖 AI 短文', available: true },
      { id: 'galaxy', label: '🌌 词汇星系', available: false },
      { id: 'insight', label: '🧠 深度洞察', available: false },
    ]

    const currentTab = ref('overview')
    const data = reactive(appData)

    // Inject current tab into data for placeholder
    const pageData = computed(() => ({
      ...data,
      tab: currentTab.value
    }))

    return { tabs, currentTab, data: pageData }
  }
}

const app = createApp(App)
app.component('StarfieldBg', StarfieldBg)
app.component('PageOverview', PageOverview)
app.component('PageAcademic', PageAcademic)
app.component('PageEssays', PageEssays)
app.component('PagePlaceholder', PagePlaceholder)

// 错误捕获——渲染到页面而非静默吞掉
app.config.errorHandler = (err, instance, info) => {
  const el = document.getElementById('app')
  if (el) {
    const errDiv = document.createElement('div')
    errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#330000;color:#FF3355;padding:16px;font-family:monospace;font-size:12px;white-space:pre-wrap;border-bottom:2px solid #FF3355;max-height:50vh;overflow-y:auto;'
    errDiv.textContent = '[Vue Error] ' + (err.message || err) + '\n\nInfo: ' + (info || 'unknown') + '\n\nStack: ' + (err.stack || 'none')
    el.parentNode.insertBefore(errDiv, el)
  }
  console.error('[Vue]', err, info)
}

// 手动 try/catch mount
try {
  app.mount('#app')
  console.log('[Dashboard] Mount OK')
} catch(e) {
  console.error('[Dashboard] Mount failed:', e)
  const el = document.getElementById('app')
  if (el) {
    el.innerHTML = '<div style="color:#FF3355;padding:40px;text-align:center;"><h1>Mount Failed</h1><pre style="font-size:12px;">' + (e.message || e) + '</pre></div>'
  }
}
</script>
</body>
